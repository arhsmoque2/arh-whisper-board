name: CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch Sherpa-ONNX Vendored Libs
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Whisper Doctor & Invariant Gates
        run: |
          python tools/whisper_doctor.py
          python scripts/ci_asbuilt_doctor.py

      - name: Run Unit Tests (Touch Filter & Markdown Exporter)
        run: ./gradlew testDebugUnitTest --continue

      - name: Android Lint Check
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arh-whisper-board-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
