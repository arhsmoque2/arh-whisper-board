name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch Sherpa-ONNX Vendored Libs
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Release APKs
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/arh-dictate-arm64-v8a-release.apk
            app/build/outputs/apk/release/arh-dictate-universal-release.apk
            app/build/outputs/apk/release/arh-dictate-armeabi-v7a-release.apk
            app/build/outputs/apk/release/arh-dictate-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
